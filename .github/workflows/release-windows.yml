name: 发布 Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.1.0-alpha.4
        required: true
        default: v0.1.0-alpha.4
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    name: 构建、验证并发布
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: 解析发布版本
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG
          } else {
            $env:REF_NAME
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unsupported release tag: $tag"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV

      - name: 检出发布标签
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 验证标签提交
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($head -ne $tagCommit) {
            throw "Checked out $head, but $env:RELEASE_TAG points to $tagCommit"
          }

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/pyproject.toml

      - name: 安装 SDK 与桥接服务
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          .\scripts\setup-bridge.ps1 -Python $python

      - name: 构建、测试并打包
        shell: pwsh
        run: |
          .\scripts\package-windows.ps1 -Version $env:RELEASE_VERSION
          $zipPath = Join-Path $PWD "out\ConvbasedVST3-$env:RELEASE_VERSION-windows-x64.zip"
          .\scripts\test-package-windows.ps1 -ZipPath $zipPath

      - name: 保存构建产物
        uses: actions/upload-artifact@v6
        with:
          name: ConvbasedVST3-windows-x64-${{ github.run_id }}
          path: |
            out/*.zip
            out/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = Join-Path $PWD "out\ConvbasedVST3-$env:RELEASE_VERSION-windows-x64.zip"
          $hashPath = "$zipPath.sha256"
          gh release view $env:RELEASE_TAG --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $zipPath $hashPath --clobber
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              $zipPath, $hashPath,
              '--verify-tag',
              '--generate-notes',
              '--title', "Convbased Bridge VST3 $env:RELEASE_TAG"
            )
            if ($env:RELEASE_VERSION.Contains('-')) {
              $arguments += '--prerelease'
            }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing GitHub Release failed with exit code $LASTEXITCODE"
          }
