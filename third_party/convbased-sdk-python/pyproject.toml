[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convbased"
version = "0.1.0"
description = "Convbased real-time voice conversion SDK (Python) — connect to the signaling service with an API key and stream audio through WebRTC (aiortc)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Convbased" }]
keywords = ["convbased", "webrtc", "voice-conversion", "realtime", "audio", "sdk"]
dependencies = [
    "aiortc>=1.6",
    "websockets>=12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/convbased"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
